name: Secure Multi-Platform Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Archive app
        run: |
          mkdir -p build
          xcodebuild \
            -project LyricDrop.xcodeproj \
            -scheme LyricDrop \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/LyricDrop.xcarchive \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            archive
      - name: Re-sign ad-hoc
        run: |
          APP=build/LyricDrop.xcarchive/Products/Applications/LyricDrop.app
          xattr -cr "$APP"
          codesign --force --deep --sign - --options runtime "$APP"
          codesign --verify --deep --strict "$APP"
      - name: Package DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STAGE=build/dmg-stage
          mkdir -p "$STAGE"
          cp -R build/LyricDrop.xcarchive/Products/Applications/LyricDrop.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "LyricDrop" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "build/LyricDrop-${VERSION}-macOS.dmg"
      - name: Attest macOS artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'build/LyricDrop-*-macOS.dmg'
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/LyricDrop-*-macOS.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore LyricDrop-Windows.Tests/LyricDrop.Windows.Tests.csproj -r win-x64
      - name: Test
        run: dotnet test LyricDrop-Windows.Tests/LyricDrop.Windows.Tests.csproj -c Release -r win-x64 --no-restore
      - name: Publish self-contained app
        shell: pwsh
        run: |
          dotnet publish LyricDrop-Windows/LyricDrop.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:TreatWarningsAsErrors=true `
            -o publish
      - name: Package Windows app
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $stage = "LyricDrop-Windows-$version-win-x64"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Path 'publish\*' -Destination $stage
          Copy-Item -LiteralPath 'LyricDrop-Windows\README.md', 'LyricDrop-Windows\RELEASE_NOTES.md', 'LICENSE' -Destination $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "$stage.zip" -CompressionLevel Optimal
      - name: Attest Windows artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'LyricDrop-Windows-*-win-x64.zip'
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: LyricDrop-Windows-*-win-x64.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
