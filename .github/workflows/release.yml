name: Secure Multi-Platform Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v*.*.* tag to build and publish'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
      - name: Resolve version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || exit 1
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Archive (ad-hoc signed)
        run: |
          mkdir -p build
          xcodebuild \
            -project LyricDrop.xcodeproj \
            -scheme LyricDrop \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/LyricDrop.xcarchive \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            archive
      - name: Re-sign ad-hoc
        run: |
          APP=build/LyricDrop.xcarchive/Products/Applications/LyricDrop.app
          xattr -cr "$APP"
          codesign --force --deep --sign - --options runtime "$APP"
          codesign --verify --deep --strict "$APP"
      - name: Package DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STAGE=build/dmg-stage
          mkdir -p "$STAGE"
          cp -R build/LyricDrop.xcarchive/Products/Applications/LyricDrop.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "LyricDrop" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "build/LyricDrop-${VERSION}-macOS.dmg"
          xattr -cr "build/LyricDrop-${VERSION}-macOS.dmg"
          ls -la "build/LyricDrop-${VERSION}-macOS.dmg"
      - name: Attest macOS artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'build/LyricDrop-*-macOS.dmg'
      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release
          path: build/LyricDrop-*-macOS.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag does not exist' }
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore LyricDrop-Windows.Tests/LyricDrop.Windows.Tests.csproj -r win-x64 --locked-mode
      - name: Test
        run: dotnet test LyricDrop-Windows.Tests/LyricDrop.Windows.Tests.csproj -c Release -r win-x64 --no-restore
      - name: Publish self-contained app
        shell: pwsh
        run: |
          dotnet publish LyricDrop-Windows/LyricDrop.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:TreatWarningsAsErrors=true `
            -o publish
      - name: Package Windows app
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $stage = "LyricDrop-Windows-$version-win-x64"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Path 'publish\*' -Destination $stage
          Copy-Item -LiteralPath 'LyricDrop-Windows\README.md', 'LyricDrop-Windows\RELEASE_NOTES.md', 'LICENSE' -Destination $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "$stage.zip" -CompressionLevel Optimal
      - name: Attest Windows artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'LyricDrop-Windows-*-win-x64.zip'
      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: LyricDrop-Windows-*-win-x64.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
